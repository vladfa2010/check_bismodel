# FinModel AI — VDS (Beget) production compose
# Caddy (TLS) → app (FastAPI: статика + /api) → данные в named volume appdata
#
# Перед первым запуском: cp ../.env.example .env и заполнить значения.

services:
  app:
    build: ..
    restart: unless-stopped
    environment:
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY:-}
      - MOONSHOT_BASE_URL=${MOONSHOT_BASE_URL:-https://api.moonshot.ai/v1}
      - KIMI_MODEL=${KIMI_MODEL:-kimi-k3}
      - SESSION_SECRET=${SESSION_SECRET:-dev-secret-change-me}
      - DATA_DIR=/var/data
    volumes:
      - appdata:/var/data          # SQLite + файлы юзеров — персистентно
    expose: ["8000"]
    networks: [web]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-:80}   # без домена — HTTP на :80; с доменом — авто-HTTPS
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data           # сертификаты Let's Encrypt
      - caddy_config:/config
    networks: [web]
    depends_on:
      app:
        condition: service_started

  # ===== бэкап SQLite (срез «полировка») =====
  # litestream:
  #   image: litestream/litestream:latest
  #   restart: unless-stopped
  #   volumes:
  #     - appdata:/var/data
  #     - ./litestream.yml:/etc/litestream.yml:ro
  #   entrypoint: ["litestream", "replicate", "-config", "/etc/litestream.yml"]

volumes:
  appdata:
  caddy_data:
  caddy_config:

networks:
  web:
